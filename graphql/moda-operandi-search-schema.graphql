input TrunkshowCollectionInput {
  """
  List of categories to filter by, e.g. ["Clothing", "Bags"]
  """
  category: [String]
  """
  Designer ids to filter and sort by, e.g. ["3391", "317"]
  """
  designer_ids: [String]
  """
  Designer slugs to filter by, e.g. ["alexis","louis-vuitton"]
  """
  designer_slugs: [String]
  """
  List of categories to exclude, e.g. ["Clothing", "Bags"]
  """
  excluded_categories: [String]
  """
  Vertical to filter by
  """
  gender: Gender
  """
  Applies raw Algolia optionalFilters directly, bypassing Rules — for instant preview of unpublished changes
  """
  optional_filters: [String]
  """
  Overwrites the rule contexts sent to Algolia
  """
  rule_contexts: [String]
  """
  Allows previewing of unpublished rules
  """
  rules: [Rule]
  """
  Return only single designer trunkshows
  """
  single_designer_only: Boolean
  """
  Optional version id from Pumo
  """
  version_id: Int
}

