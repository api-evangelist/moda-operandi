root_entity: Variant
domain_summary: The graph is a luxury-retail merchandising catalog organised around four nouns. A DESIGNER
  is a brand. A TRUNKSHOW is a designer's pre-order runway collection for a season, the concept Moda Operandi
  was founded on. A LOOK is one styled runway outfit inside a trunkshow. A VARIANT is a buyable SKU (colour/size),
  and is the entity every search, listing and recommendation query ultimately returns. CollectionResult
  is not a domain entity but the faceted-search envelope that wraps a VariantConnection with every filter
  bucket the storefront renders.
