input CollectionInput {
  attribute_types: [String]
  attributes: [String]
  availability: [AvailabilityInput]
  availability_enum: [Availability!]
  category_path: String
  collections: [String]
  country_code: String
  designers: [String]
  """
  Algolia Dynamic Re-Ranking
  """
  dynamic_reranking: Boolean
  filter_colors: [String]
  gift_category_path: String
  materials: [String]
  no_sale: Boolean
  on_sale: Boolean
  """
  Applies raw Algolia optionalFilters directly, bypassing Rules — for instant preview of unpublished changes
  """
  optional_filters: [String]
  price_range: PriceRange
  primary_attributes: [String]
  """
  Same as `attributes`, but has a higher precedence.
More specifically:
- `primary_attributes` and `attributes` are joined with AND, while values inside these 2 buckets are joined with OR.
- The facets for `attributes` are filtered by `primary_attributes` while the opposite is not true.
  """
  q: String
  rounded_markdown_percentages: [String]
  """
  Overwrites the rule contexts sent to Algolia
  """
  rule_contexts: [String]
  """
  Allows previewing of unpublished rules
  """
  rules: [Rule]
  """
  sale: true - returns only items on sale
sale: false - returns only items NOT on sale
sale: null - returns all items (both on sale and not on sale)
  """
  sale: Boolean
  sale_tags: [String]
  scoring: String
  sizes: [String]
  variant_ids: [String]
  version_id: Int
}

input Condition {
  alternatives: Boolean
  anchoring: String
  context: String
  pattern: String
}

input Consequence {
  filterPromotes: Boolean
  params: RuleParams
  promote: [RulePromote!]!
}

input FromToTimestamp {
  from: Int
  to: Int
}

