aid: moda-operandi
name: Moda Operandi
description: >-
  Moda Operandi is a New York-based luxury fashion e-commerce marketplace founded in 2010 by
  Lauren Santo Domingo and Aslaug Magnusdottir, built around the "trunkshow" model — customers
  pre-order directly from designers' full runway collections weeks before the clothes reach
  stores — alongside a conventional in-season boutique carrying more than 1,000 brands across
  ready-to-wear, fine jewelry, home and beauty. The company publishes no developer program,
  no partner API documentation and no OpenAPI definition. It does, however, operate a
  first-party GraphQL search and merchandising API at search.modaoperandi.com/graphql that
  powers modaoperandi.com itself, which answers anonymous introspection and exposes a
  read-only, 37-field catalog graph (trunkshows, designers, looks, product variants,
  recommendations and faceted search). Moda Operandi also publishes its design system and
  design tokens as first-party npm packages under the @moda scope.
