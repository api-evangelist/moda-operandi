  """
  Same as `attributes`, but has a higher precedence.
More specifically:
- `primary_attributes` and `attributes` are joined with AND, while values inside these 2 buckets are joined with OR.
- The facets for `attributes` are filtered by `primary_attributes` while the opposite is not true.
  """
  q: String
  rounded_markdown_percentages: [String]
  """
  Overwrites the rule contexts sent to Algolia
