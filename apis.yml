apis:
- aid: moda-operandi:search-api
  name: Moda Operandi Search API
  description: >-
    The first-party GraphQL API that powers search, browse and merchandising on
    modaoperandi.com. It is referenced by the storefront's own client bundle as
    SEARCH_API_GRAPHQL_ENDPOINT, answers anonymous introspection, and is read-only —
    the schema declares a Query root and no mutation or subscription root. Thirty-seven
    query fields cover keyword search and autocomplete, faceted product-listing
    collections, designers, trunkshows, looks, variants, gift categories, editorial
    slides and Algolia-backed recommendations (bought_together, looking_similar,
    related_products, trending_items). Moda Operandi does not document this API for
    third-party use; it is captured here as an observed public surface.
  humanURL: https://www.modaoperandi.com/
  baseURL: https://search.modaoperandi.com/graphql
