note: >-
  No /.well-known/ document is served on any Moda Operandi host. Three distinct negative
  behaviours were observed and are recorded separately below because they are different facts.
  (1) www.modaoperandi.com is a single-page React storefront that 301-redirects every
  /.well-known/<name> request to /well-known/<name-with-dots-stripped> — e.g.
  /.well-known/security.txt -> /well-known/securitytxt — and that target then returns an HTTP 404
  carrying the ~197KB SPA shell. A control probe of a deliberately nonsensical path
  (/well-known/definitely-not-real-xyz123) returned the same 404 and the same ~197KB body, so the
  host is a catch-all and none of these are documents. (2) api.modaoperandi.com returns a clean
  HTTP 404 with a zero-byte body for every /.well-known/ path. (3) search.modaoperandi.com is a
  GraphQL server mounted at the site root that answers EVERY path, including / itself, with an
  HTTP 400 GraphQL error ("GraphQL operations must contain a non-empty query"); it serves no
  static files at all. NO WellKnown and NO SecurityTxt pointer is emitted in apis.yml, because
  nothing was fetched and nothing was saved.
